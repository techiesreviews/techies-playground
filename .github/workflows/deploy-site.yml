name: Deploy site

# Shared by deploy.yml (production, from main) and deploy-preview.yml (preview, from dev).
# Runs the tests and the security checks first; only when both pass does it deploy our copy
# of WordPress Playground, then the launcher that embeds it.
on:
  workflow_call:
    inputs:
      environment:
        description: production or preview
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  settings:
    name: Read deployment settings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wrangler_env: ${{ steps.settings.outputs.wrangler_env }}
      launcher_url: ${{ steps.settings.outputs.launcher_url }}
      playground_origin: ${{ steps.settings.outputs.playground_origin }}
      launcher_origins: ${{ steps.settings.outputs.launcher_origins }}
      playground_version: ${{ steps.release.outputs.version }}
      playground_patch_sha256: ${{ steps.patch.outputs.sha256 }}
    steps:
      - name: Check out package.json and the Playground core patch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            package.json
            playground-host/playground-core.patch
          sparse-checkout-cone-mode: false

      # The launcher bundles @wp-playground/blueprints and loads the client from the
      # host, so the host is built from the release that matches the blueprints pin.
      - name: Read the pinned Playground release
        id: release
        run: |
          version="$(node -p "require('./package.json').dependencies['@wp-playground/blueprints']")"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "@wp-playground/blueprints must pin an exact version, found $version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The build job has no token and no checkout, so it downloads the patch by commit and
      # checks it against this hash.
      - name: Hash the Playground core patch
        id: patch
        run: |
          sha256="$(sha256sum playground-host/playground-core.patch | cut -d ' ' -f 1)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Choose hosts for the environment
        id: settings
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "$ENVIRONMENT" in
            production)
              {
                echo "wrangler_env="
                echo "launcher_url=https://play.techies.tools"
                echo "playground_origin=https://wp.techies.tools"
                echo "launcher_origins=--launcher-origin https://play.techies.tools"
              } >> "$GITHUB_OUTPUT"
              ;;
            preview)
              {
                echo "wrangler_env=--env preview"
                echo "launcher_url=https://preview-play.techies.tools"
                echo "playground_origin=https://preview-wp.techies.tools"
                echo "launcher_origins=--launcher-origin https://preview-play.techies.tools --launcher-origin http://127.0.0.1:4173 --launcher-origin http://localhost:4173"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown environment: $ENVIRONMENT" >&2
              exit 1
              ;;
          esac

  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # The same checks as security-checks.yml, minus the Dependabot alerts (they describe main
  # and are read on its schedule): nothing deploys while a high advisory is open.
  security:
    name: Check dependencies and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Audit the npm dependencies
        run: npm audit --audit-level=high

      - name: Check Playground security advisories
        if: success() || failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-playground-advisories.mjs

  # Upstream's build installs thousands of third-party packages with install scripts, so it
  # runs in a job with no token permissions and no secrets. It hands its output to the deploy
  # job as an artifact of this run; nothing is read from the Actions cache, where another
  # workflow could have saved a build under a key anyone can predict.
  playground-build:
    name: Build Playground from the official repository
    needs: settings
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {}
    steps:
      # Upstream requires Node 24.18+ and npm 11.16+ (engine-strict); the runner's default
      # Node and npm may be older.
      - name: Set up Node.js for the upstream build
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '>=24.18.0 <25'
          check-latest: true

      - name: Build Playground ${{ needs.settings.outputs.playground_version }}
        env:
          PLAYGROUND_VERSION: ${{ needs.settings.outputs.playground_version }}
          # Our host answers /cors-proxy.php (playground-host/cors-proxy.js); the public
          # proxy only serves playground.wordpress.net. Playground's service worker never
          # caches a .php path, so the name must end in .php.
          CORS_PROXY_URL: /cors-proxy.php?
          # Our fix for request bodies in Firefox (playground-host/playground-core.patch).
          PATCH_SHA256: ${{ needs.settings.outputs.playground_patch_sha256 }}
        run: |
          git clone --branch "v${PLAYGROUND_VERSION}" --single-branch --depth 1 \
            --recurse-submodules --shallow-submodules \
            https://github.com/WordPress/wordpress-playground.git "$RUNNER_TEMP/wordpress-playground"
          cd "$RUNNER_TEMP/wordpress-playground"
          # The repository is public, so the patch downloads without a token.
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/playground-host/playground-core.patch" \
            --output "$RUNNER_TEMP/playground-core.patch"
          echo "$PATCH_SHA256  $RUNNER_TEMP/playground-core.patch" | sha256sum --check --strict
          git apply --verbose "$RUNNER_TEMP/playground-core.patch" || {
            echo "playground-host/playground-core.patch does not apply to Playground v${PLAYGROUND_VERSION}. If that release fixes request bodies in Firefox, remove the patch; otherwise update it." >&2
            exit 1
          }
          npm install --global npm@^11.16.0 --no-audit --no-fund
          echo "Node $(node --version), npm $(npm --version)"
          npm ci --no-audit --no-fund
          npm run build:website
          find dist/packages/playground/wasm-wordpress-net -name '*.map' -delete
          mkdir -p "$GITHUB_WORKSPACE/.playground-build"
          mv dist/packages/playground/wasm-wordpress-net "$GITHUB_WORKSPACE/.playground-build/"
          cd "$GITHUB_WORKSPACE"
          rm -rf "$RUNNER_TEMP/wordpress-playground"

      - name: Upload the Playground build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playground-website
          path: .playground-build/wasm-wordpress-net
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  playground-host:
    name: Deploy Playground host
    # Nothing goes live unless the tests and the security checks passed.
    needs: [settings, test, security, playground-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download the Playground build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: playground-website
          path: .playground-build/wasm-wordpress-net

      - name: Prepare the Playground host folder
        env:
          LAUNCHER_ORIGINS: ${{ needs.settings.outputs.launcher_origins }}
        run: |
          # LAUNCHER_ORIGINS holds several --launcher-origin flags; split them on purpose.
          # shellcheck disable=SC2086
          node scripts/prepare-playground-host.mjs .playground-build/wasm-wordpress-net playground-host/dist $LAUNCHER_ORIGINS
          grep -rqF '"/cors-proxy.php?"' playground-host/dist/assets || { echo "The Playground build does not use /cors-proxy.php." >&2; exit 1; }
          # The host origin holds saved sites and licence keys: no page that starts a Playground from its URL.
          test ! -e playground-host/dist/index.html || { echo "The Playground host folder still has the public website (index.html)." >&2; exit 1; }
          pages="$(cd playground-host/dist && find . -regextype posix-extended -type f \( -iname '*.html' -o -iname '*.htm' \) -not -regex '\./wp-([0-9]+\.[0-9]+|beta|nightly|trunk)/.*' | sort | tr '\n' ' ')"
          test "$pages" = "./remote.html ./wordpress-bridge.html ./wordpress-popup.html " || { echo "Unexpected pages in the Playground host folder: $pages" >&2; exit 1; }

      - name: Deploy the Playground host
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config playground-host/wrangler.jsonc ${{ needs.settings.outputs.wrangler_env }}

      - name: Check the Playground host answers
        env:
          PLAYGROUND_ORIGIN: ${{ needs.settings.outputs.playground_origin }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS -o /dev/null "$PLAYGROUND_ORIGIN/remote.html"; then break; fi
            if [ "$attempt" = 6 ]; then echo "$PLAYGROUND_ORIGIN/remote.html did not answer." >&2; exit 1; fi
            sleep 20
          done
          curl -fsSI "$PLAYGROUND_ORIGIN/remote.html" | grep -i '^content-security-policy: frame-ancestors'
          index_status="$(curl -sS -o /dev/null -w '%{http_code}' "$PLAYGROUND_ORIGIN/index.html")"
          test "$index_status" = 404 || { echo "$PLAYGROUND_ORIGIN/index.html answered $index_status, expected 404." >&2; exit 1; }
          split_file="$(node -p "Object.keys(require('./playground-host/dist/split-files.json'))[0] || ''")"
          if [ -n "$split_file" ]; then
            curl -fsS -o /dev/null -w '%{http_code} %{size_download} bytes\n' "$PLAYGROUND_ORIGIN$split_file"
          fi

  launcher:
    name: Deploy launcher
    needs: [settings, test, security, playground-host]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build launcher assets
        env:
          VITE_PLAYGROUND_ORIGIN: ${{ needs.settings.outputs.playground_origin }}
        run: npm run build

      - name: Deploy the launcher
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy ${{ needs.settings.outputs.wrangler_env }}

      - name: Publish deployment links
        env:
          LAUNCHER_URL: ${{ needs.settings.outputs.launcher_url }}
          PLAYGROUND_ORIGIN: ${{ needs.settings.outputs.playground_origin }}
        run: |
          {
            echo "### Deployed to [${LAUNCHER_URL#https://}]($LAUNCHER_URL)"
            echo "Playground host: [${PLAYGROUND_ORIGIN#https://}]($PLAYGROUND_ORIGIN/remote.html)"
          } >> "$GITHUB_STEP_SUMMARY"
