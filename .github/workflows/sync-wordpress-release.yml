name: Sync WordPress stable release

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-wordpress-stable-release
  cancel-in-progress: false

jobs:
  sync:
    name: Check WordPress.org and prepare an update
    if: github.repository == 'techiesreviews/techies-playground'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Synchronize the stable release
        id: sync
        run: node scripts/sync-wordpress-release.mjs

      - name: Verify the generated update
        if: steps.sync.outputs.changed == 'true'
        run: |
          npm test
          npm run build
          git diff --check

      - name: Open or refresh the release pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.sync.outputs.app_version }}
          WORDPRESS_VERSION: ${{ steps.sync.outputs.wordpress_version }}
        run: |
          branch="automation/wordpress-${WORDPRESS_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add package.json package-lock.json src/App.jsx src/lib/wordpress-versions.js
          git commit -m "Add WordPress ${WORDPRESS_VERSION} support"
          git push --force origin "$branch"
          existing_pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Add WordPress ${WORDPRESS_VERSION} support" \
              --body "Automated synchronization from the official WordPress.org stable-version API. Updates the offline fallback, app version, and user-facing changelog to ${APP_VERSION}."
          fi
