name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-techies-tools-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy play.techies.tools and wp.techies.tools
    if: >-
      github.repository == 'techiesreviews/techies-playground' &&
      github.actor == 'techiesreviews' &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-site.yml
    with:
      environment: production
    secrets: inherit
